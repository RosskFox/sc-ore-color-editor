<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>INI Color Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.8125rem);
    --text-sm: clamp(0.8125rem, 0.76rem + 0.28vw, 0.9rem);
    --text-base: clamp(0.875rem, 0.83rem + 0.22vw, 0.975rem);
    --text-lg: clamp(1.05rem, 0.95rem + 0.5vw, 1.2rem);
    --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
    --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem;
    --space-8: 2rem; --space-12: 3rem;
    --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.75rem;
    --transition: 180ms cubic-bezier(0.16,1,0.3,1);
    --font-body: 'Satoshi','Inter',system-ui,sans-serif;
    --font-mono: 'JetBrains Mono','SFMono-Regular',ui-monospace,monospace;
  }
  [data-theme='dark'] {
    --bg: #000000; --surface: #0a0a0a; --surface-2: #141414; --surface-3: #1c1c1c;
    --border: #2a2a2a; --border-soft: #1f1f1f;
    --text: #f2f2f2; --text-muted: #9a9a9a; --text-faint: #6a6a6a;
    --accent: #2bb3b3; --accent-hover: #3fc7c7; --accent-soft: rgba(43,179,179,0.16);
    --on-accent: #001515;
    --danger: #e06464; --success: #5fb84a; --row-stripe: rgba(255,255,255,0.02);
  }
  [data-theme='light'] {
    --bg: #ffffff; --surface: #ffffff; --surface-2: #f5f5f5; --surface-3: #ededed;
    --border: #d8d8d8; --border-soft: #e8e8e8;
    --text: #1a1a1a; --text-muted: #6a6a6a; --text-faint: #a0a0a0;
    --accent: #0e8a8a; --accent-hover: #0a6e6e; --accent-soft: rgba(14,138,138,0.12);
    --on-accent: #ffffff;
    --danger: #c64545; --success: #3f8a28; --row-stripe: rgba(0,0,0,0.02);
  }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  html { -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  body { height:100dvh; overflow:hidden; line-height:1.55; font-family:var(--font-body); font-size:var(--text-base); color:var(--text); background:var(--bg); display:flex; flex-direction:column; }
  button { cursor:pointer; background:none; border:none; color:inherit; font:inherit; }
  input,textarea,select { font:inherit; color:inherit; }
  a,button,input,textarea,select { transition:color var(--transition),background var(--transition),border-color var(--transition),box-shadow var(--transition); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--radius-sm); }

  .topbar { display:flex; align-items:center; gap:var(--space-4); padding:var(--space-3) var(--space-5); background:var(--surface); border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:var(--space-3); margin-right:auto; }
  .logo { width:32px; height:32px; flex:none; color:var(--accent); }
  .brand h1 { font-size:var(--text-lg); font-weight:700; letter-spacing:-0.01em; line-height:1; }
  .brand .sub { font-size:var(--text-xs); color:var(--text-muted); font-family:var(--font-mono); margin-top:2px; }
  .file-btn { display:inline-flex; align-items:center; gap:var(--space-2); padding:var(--space-2) var(--space-4); background:var(--accent); color:var(--on-accent); font-weight:700; font-size:var(--text-sm); border-radius:var(--radius-md); box-shadow:0 1px 2px rgba(0,0,0,0.25); }
  .file-btn:hover { background:var(--accent-hover); }
  .file-btn.ghost { background:transparent; color:var(--text); border:1px solid var(--border); box-shadow:none; }
  .file-btn.ghost:hover { background:var(--surface-2); border-color:var(--accent); }
  .icon-btn { width:38px; height:38px; display:grid; place-items:center; border:1px solid var(--border); border-radius:var(--radius-md); color:var(--text-muted); }
  .icon-btn:hover { color:var(--text); border-color:var(--accent); background:var(--surface-2); }
  .stats { display:flex; gap:var(--space-4); font-size:var(--text-xs); color:var(--text-muted); font-family:var(--font-mono); }
  .stats b { color:var(--text); font-weight:700; }

  .workspace { flex:1; display:grid; grid-template-columns: 0.9fr 1.3fr 1.1fr; min-height:0; overflow:hidden; }
  .pane { display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--surface); border-right:1px solid var(--border); }
  .pane:last-child { border-right:none; }
  .pane-head { display:flex; align-items:center; gap:var(--space-3); padding:var(--space-3) var(--space-4); border-bottom:1px solid var(--border); background:var(--surface-2); flex-wrap:wrap; }
  .pane-head h2 { font-size:var(--text-sm); font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:var(--text-muted); }
  .pane-head .count { font-family:var(--font-mono); font-size:var(--text-xs); color:var(--accent); margin-left:auto; }
  .pane-body { flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column; }

  /* Left */
  .left-actions { padding:var(--space-2) var(--space-3); border-bottom:1px solid var(--border-soft); display:flex; gap:var(--space-2); flex-wrap:wrap; }
  .left-actions .mini-btn { flex:1; justify-content:center; }
  .dropzone { margin:var(--space-3); padding:var(--space-8) var(--space-4); border:2px dashed var(--border); border-radius:var(--radius-lg); text-align:center; color:var(--text-muted); }
  .dropzone.drag { border-color:var(--accent); background:var(--accent-soft); color:var(--text); }
  .dropzone p { margin:var(--space-2) 0; }
  .dropzone .big { font-size:var(--text-base); color:var(--text); font-weight:500; }
  .file-meta { padding:var(--space-2) var(--space-4); font-family:var(--font-mono); font-size:var(--text-xs); color:var(--text-muted); border-bottom:1px solid var(--border-soft); display:flex; gap:var(--space-4); flex-wrap:wrap; }
  .file-meta b { color:var(--text); }
  .raw-view { flex:1; min-height:0; overflow:auto; font-family:var(--font-mono); font-size:12px; line-height:1.5; padding:var(--space-2) 0; }
  .raw-line { display:flex; gap:var(--space-3); padding:0 var(--space-4); white-space:pre; }
  .raw-line:hover { background:var(--row-stripe); }
  .raw-line .ln { color:var(--text-faint); user-select:none; text-align:right; min-width:4em; flex:none; }
  .raw-line .lc { color:var(--text-muted); }
  .raw-line .lhs { color:var(--accent); }
  .raw-line .eq { color:var(--text-faint); }
  .raw-line .rhs { color:var(--text); }
  .raw-line .colordot { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; vertical-align:middle; border:1px solid var(--border); flex:none; }

  /* Center */
  .toolbar { display:flex; align-items:center; gap:var(--space-2); padding:var(--space-2) var(--space-3); border-bottom:1px solid var(--border-soft); flex-wrap:wrap; }
  .search { flex:1; min-width:120px; display:flex; align-items:center; gap:var(--space-2); padding:var(--space-2) var(--space-3); background:var(--surface-3); border:1px solid var(--border); border-radius:var(--radius-md); }
  .search svg { flex:none; color:var(--text-faint); }
  .search input { flex:1; background:none; border:none; outline:none; font-size:var(--text-sm); }
  .search input::placeholder { color:var(--text-faint); }
  .mini-btn { padding:var(--space-2) var(--space-3); font-size:var(--text-xs); font-weight:500; border:1px solid var(--border); border-radius:var(--radius-md); color:var(--text-muted); background:var(--surface-3); white-space:nowrap; display:inline-flex; align-items:center; gap:var(--space-1); }
  .mini-btn:hover { color:var(--text); border-color:var(--accent); }
  .mini-btn:disabled { opacity:0.4; cursor:not-allowed; }
  .mini-btn.danger:hover { color:var(--danger); border-color:var(--danger); }

  .filter-chips { display:flex; gap:var(--space-2); padding:var(--space-2) var(--space-3); flex-wrap:wrap; border-bottom:1px solid var(--border-soft); }
  .chip { padding:var(--space-1) var(--space-3); font-size:var(--text-xs); border:1px solid var(--border); border-radius:9999px; color:var(--text-muted); background:var(--surface-3); }
  .chip:hover { border-color:var(--accent); color:var(--text); }
  .chip.active { color:var(--text); border-color:var(--accent); background:var(--accent-soft); }

  .cat-bar { display:flex; align-items:center; gap:var(--space-2); padding:var(--space-2) var(--space-3); border-bottom:1px solid var(--border-soft); }
  .cat-bar .label { font-size:var(--text-xs); color:var(--text-faint); text-transform:uppercase; letter-spacing:0.05em; white-space:nowrap; }
  .cat-select { flex:1; min-width:0; font-size:var(--text-xs); padding:var(--space-1) var(--space-2); border:1px solid var(--border); border-radius:var(--radius-md); background:var(--surface-3); color:var(--text); }
  .cat-sub { display:flex; gap:var(--space-1); padding:var(--space-1) var(--space-3) var(--space-2); flex-wrap:wrap; max-height:84px; overflow-y:auto; border-bottom:1px solid var(--border-soft); }
  .cat-sub:empty { display:none; }
  .cat-sub .chip { padding:2px var(--space-2); font-size:11px; }
  .cat-sub .chip .cnt { color:var(--text-faint); margin-left:4px; font-size:10px; }

  .list-wrap { flex:1; min-height:0; overflow:hidden; position:relative; }
  .vscroll { height:100%; overflow-y:auto; overflow-anchor:none; }
  .vspacer { position:relative; width:100%; }
  .row { position:absolute; left:0; right:0; display:flex; align-items:center; gap:var(--space-3); padding:var(--space-2) var(--space-4); border-bottom:1px solid var(--border-soft); }
  .row:nth-child(even) { background:var(--row-stripe); }
  .row .idx { font-family:var(--font-mono); font-size:11px; color:var(--text-faint); min-width:3.5em; text-align:right; flex:none; }
  .swatch { position:relative; width:34px; height:34px; flex:none; border-radius:var(--radius-sm); border:1px solid var(--border); cursor:pointer; overflow:hidden; background:linear-gradient(45deg, var(--surface-3) 25%, transparent 25%) 0 0/10px 10px, linear-gradient(-45deg, var(--surface-3) 25%, transparent 25%) 0 5px/10px 10px; }
  .swatch input[type=color] { position:absolute; inset:-2px; width:calc(100% + 4px); height:calc(100% + 4px); border:none; padding:0; cursor:pointer; opacity:0; }
  .swatch .fill { position:absolute; inset:0; }
  .row .key { font-family:var(--font-mono); font-size:12.5px; font-weight:600; color:var(--text); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .val { font-family:var(--font-mono); font-size:11px; color:var(--text-faint); flex:1.3; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hex { width:78px; flex:none; font-family:var(--font-mono); font-size:11px; padding:var(--space-1) var(--space-2); background:var(--surface-3); border:1px solid var(--border); border-radius:var(--radius-sm); text-align:center; text-transform:uppercase; }
  .hex:focus { border-color:var(--accent); }
  .clear-x { width:22px; height:22px; flex:none; display:grid; place-items:center; color:var(--text-faint); border-radius:var(--radius-sm); }
  .clear-x:hover { color:var(--danger); background:var(--surface-3); }
  .empty-state { padding:var(--space-12); text-align:center; color:var(--text-muted); }
  .empty-state svg { color:var(--text-faint); margin:0 auto var(--space-4); }
  .empty-state .big { font-size:var(--text-base); color:var(--text); font-weight:500; margin-bottom:var(--space-1); }

  /* Right */
  .out-actions { display:flex; gap:var(--space-2); margin-left:auto; }
  .seg { display:flex; border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; background:var(--surface-3); }
  .seg button { padding:var(--space-2) var(--space-3); font-size:var(--text-xs); color:var(--text-muted); border-right:1px solid var(--border); }
  .seg button:last-child { border-right:none; }
  .seg button.active { background:var(--accent-soft); color:var(--accent); }
  .copy-btn { padding:var(--space-2) var(--space-4); font-size:var(--text-sm); font-weight:700; background:var(--accent); color:var(--on-accent); border-radius:var(--radius-md); display:inline-flex; align-items:center; gap:var(--space-2); }
  .copy-btn:hover { background:var(--accent-hover); }
  .copy-btn.done { background:var(--success); }
  .dl-btn { padding:var(--space-2) var(--space-3); font-size:var(--text-xs); border:1px solid var(--border); border-radius:var(--radius-md); color:var(--text-muted); display:inline-flex; align-items:center; gap:var(--space-1); }
  .dl-btn:hover { color:var(--text); border-color:var(--accent); }
  .out-format { padding:var(--space-2) var(--space-4); border-bottom:1px solid var(--border-soft); display:flex; gap:var(--space-4); align-items:center; font-size:var(--text-xs); color:var(--text-muted); flex-wrap:wrap; }
  .out-format code { font-family:var(--font-mono); color:var(--accent); background:var(--accent-soft); padding:1px 6px; border-radius:var(--radius-sm); }
  .out-stale { color:var(--danger); font-family:var(--font-mono); margin-left:auto; }
  textarea.output { flex:1; min-height:0; resize:none; font-family:var(--font-mono); font-size:12px; line-height:1.5; padding:var(--space-3); background:var(--surface); border:none; outline:none; tab-size:4; white-space:pre; overflow:auto; }

  .toast { position:fixed; bottom:var(--space-6); left:50%; transform:translateX(-50%) translateY(20px); background:var(--surface-3); border:1px solid var(--border); color:var(--text); padding:var(--space-3) var(--space-5); border-radius:var(--radius-md); font-size:var(--text-sm); font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,0.3); opacity:0; pointer-events:none; transition:all var(--transition); z-index:50; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width: 980px) {
    .workspace { grid-template-columns:1fr; grid-auto-rows:minmax(320px,1fr); }
    .pane { border-right:none; border-bottom:1px solid var(--border); }
    .stats { display:none; }
  }
  @media (prefers-reduced-motion: reduce) { *{transition-duration:0.01ms!important;} }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <path d="M16 3 5 9v14l11 6 11-6V9L16 3Z"/><path d="M16 3v14M5 9l11 8 11-8" opacity="0.6"/>
    </svg>
    <div>
      <h1>INI Color Editor</h1>
      <div class="sub">parse real keys · pick a color per key · write back</div>
    </div>
  </div>
  <div class="stats" id="stats">
    <span><b id="stKeys">0</b> keys</span>
    <span><b id="stColored">0</b> colored</span>
    <span><b id="stShown">0</b> shown</span>
  </div>
  <input type="file" id="fileInput" accept=".ini,.txt,.cfg,.conf,text/plain" hidden />
  <button class="file-btn ghost" id="sampleBtn">Load sample</button>
  <button class="file-btn" id="openBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
    Open INI
  </button>
  <button class="icon-btn" id="themeBtn" aria-label="Toggle theme"></button>
</header>

<main class="workspace">

  <!-- LEFT -->
  <section class="pane">
    <div class="pane-head"><h2>Source file</h2><span class="count" id="srcCount">no file</span></div>
    <div class="pane-body">
      <div class="left-actions">
        <button class="mini-btn" id="knownBtn" title="Load the full known-key list (89k real Star Citizen keys merged from 4 community language packs)">Load known keys</button>
        <button class="mini-btn" id="importBtn" title="Read OreName=#hex lines already in the file">Import colors</button>
      </div>
      <div class="dropzone" id="dropzone">
        <p class="big">Drop an .ini here</p>
        <p>Every <code style="font-family:var(--font-mono);color:var(--accent)">key=value</code> line is parsed into a real key you can color.</p>
      </div>
      <div class="file-meta" id="fileMeta" hidden></div>
      <div class="raw-view" id="rawView" hidden></div>
    </div>
  </section>

  <!-- CENTER -->
  <section class="pane">
    <div class="pane-head"><h2>Keys</h2><span class="count" id="centerCount">—</span></div>
    <div class="pane-body">
      <div class="toolbar">
        <label class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" id="search" placeholder="Filter keys or values…" disabled />
        </label>
        <button class="mini-btn" id="autoBtn" disabled title="Distinct hue per visible key">Auto-color</button>
        <button class="mini-btn" id="randBtn" disabled title="Randomize visible">Randomize</button>
        <button class="mini-btn danger" id="clearBtn" disabled title="Clear visible">Clear</button>
      </div>
      <div class="filter-chips">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="colored">Colored</button>
        <button class="chip" data-filter="uncolored">Uncolored</button>
      </div>
      <div class="cat-bar">
        <span class="label">Category</span>
        <select class="cat-select" id="catGroup" disabled><option>—</option></select>
      </div>
      <div class="cat-sub" id="catSub"></div>
      <div class="list-wrap">
        <div class="vscroll" id="vscroll"><div class="vspacer" id="vspacer"></div></div>
      </div>
      <div class="empty-state" id="emptyState">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        <p class="big">No file loaded</p>
        <p>Open or drop an .ini to parse its keys.</p>
      </div>
    </div>
  </section>

  <!-- RIGHT -->
  <section class="pane">
    <div class="pane-head">
      <h2>Modified INI</h2>
      <div class="out-actions">
        <button class="dl-btn" id="dlBtn">Download</button>
        <button class="copy-btn" id="copyBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copy
        </button>
      </div>
    </div>
    <div class="out-format">
      <div class="seg" id="fmtSeg">
        <button class="active" data-fmt="modify">Modify values</button>
        <button data-fmt="map">Color map only</button>
        <button data-fmt="section">[Colors]</button>
      </div>
      <span id="fmtHint"></span>
      <span class="out-stale" id="staleTag" hidden>● stale</span>
    </div>
    <textarea class="output" id="output" spellcheck="false" placeholder="Load an ini and assign colors — the modified ini (real keys only) appears here."></textarea>
  </section>

</main>
<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';
  const ROW_H = 50;
  const $ = id => document.getElementById(id);

  // ---------- State ----------
  let entries = [];        // {i, key, value, raw, hasEq}  (value = original)
  let filtered = [];      // indices into entries
  let colors = new Map(); // key -> #RRGGBB  (only explicitly colored keys)
  let filterMode = 'all';
  let outFormat = 'modify';
  let dirty = false, renderPending = false, idleGen;
  let srcName = '';

  // ---------- Categories (loaded from StarMeld categories.json) ----------
  let catGroups = [];        // [{name, categories:[{name, patterns:[re...], desc}]}]
  let catCompiled = [];      // [{gIdx, cIdx, name, tests:[(key)=>bool]}]
  let keyCat = new Map();    // key -> "gIdx:cIdx" (computed lazily per key)
  let catCounts = null;      // Map "gIdx:cIdx" -> count
  let selGroup = null;       // group index or null (all)
  let selCat = null;        // "gIdx:cIdx" or null

  async function loadCategories(){
    try {
      const res = await fetch('categories.json');
      if (!res.ok) return;
      const data = await res.json();
      catGroups = data.groups || [];
      catCompiled = [];
      const catchAll = data.catchAll || 'Other';
      for (let g=0; g<catGroups.length; g++){
        for (let c=0; c<catGroups[g].categories.length; c++){
          const cat = catGroups[g].categories[c];
          const tests = (cat.patterns||[]).map(p => { try { return new RegExp(p); } catch(_){ return null; } }).filter(Boolean);
          catCompiled.push({ gIdx:g, cIdx:c, name:cat.name, gName:catGroups[g].name, tests });
        }
      }
      // add a synthetic "Other" bucket as the catch-all group
      catGroups.push({ name: catchAll, categories: [] });
      buildGroupDropdown();
    } catch(e){ console.warn('categories load failed', e); }
  }
  function categorizeKey(key){
    if (keyCat.has(key)) return keyCat.get(key);
    let res = null;
    for (const c of catCompiled){
      if (c.tests.some(t => t.test(key))){ res = c.gIdx+':'+c.cIdx; break; }
    }
    if (res === null) res = (catGroups.length-1)+':0'; // catchAll group
    keyCat.set(key, res);
    return res;
  }
  function recomputeCatCounts(){
    catCounts = new Map();
    for (const e of entries){ if (!e.hasEq) continue; const c = categorizeKey(e.key); catCounts.set(c, (catCounts.get(c)||0)+1); }
    // catchAll group count
    const catchKey = (catGroups.length-1)+':0';
    // (already counted into catchKey via categorizeKey returning it)
  }
  function buildGroupDropdown(){
    const sel = $('catGroup'); sel.innerHTML = '';
    const all = document.createElement('option'); all.value=''; all.textContent='All categories'; sel.appendChild(all);
    catGroups.forEach((g, i) => {
      const cnt = groupCount(i);
      if (!cnt) return; // hide empty groups
      const o = document.createElement('option'); o.value=i; o.textContent = `${g.name} (${cnt.toLocaleString()})`; sel.appendChild(o);
    });
    sel.disabled = false;
  }
  function groupCount(gIdx){
    let n=0; catCounts.forEach((v,k)=>{ if (k.startsWith(gIdx+':')) n+=v; }); return n;
  }
  function buildSubChips(gIdx){
    const wrap = $('catSub'); wrap.innerHTML='';
    if (gIdx===null||gIdx===undefined||gIdx==='') { wrap.innerHTML=''; return; }
    gIdx = +gIdx;
    const g = catGroups[gIdx]; if (!g) return;
    if (gIdx === catGroups.length-1){ // catchAll: no sub-cats, single chip
      const b=document.createElement('button'); b.className='chip'; b.dataset.cat=(gIdx+':0'); b.innerHTML=`${g.name} <span class="cnt">${(catCounts.get(gIdx+':0')||0).toLocaleString()}</span>`; 
      if (selCat===(gIdx+':0')) b.classList.add('active');
      wrap.appendChild(b); return;
    }
    g.categories.forEach((cat, c)=>{
      const key=gIdx+':'+c;
      const cnt=catCounts.get(key)||0;
      if (!cnt) return;
      const b=document.createElement('button'); b.className='chip'; b.dataset.cat=key;
      b.innerHTML=`${cat.name} <span class="cnt">${cnt.toLocaleString()}</span>`;
      if (selCat===key) b.classList.add('active');
      wrap.appendChild(b);
    });
  }

  // ---------- Theme ----------
  (function(){
    let t = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark':'light';
    document.documentElement.setAttribute('data-theme', t);
    const b = $('themeBtn');
    const paint = () => b.innerHTML = t==='dark'
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2M12 20.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1.5 12h2M20.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>';
    paint();
    b.addEventListener('click', ()=>{ t = t==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',t); paint(); if(entries.length) paintRows(); });
  })();

  // ---------- Parsing ----------
  function parse(text){
    text = text.replace(/^\uFEFF/, '');
    const lines = text.split(/\r\n|\r|\n/);
    entries = [];
    for (let i=0;i<lines.length;i++){
      const raw = lines[i];
      const eq = raw.indexOf('=');
      if (eq === -1){ entries.push({i, key:null, value:null, raw, hasEq:false}); }
      else { entries.push({i, key:raw.slice(0,eq), value:raw.slice(eq+1), raw, hasEq:true}); }
    }
  }

  // ---------- File loading ----------
  function loadText(text, name){
    parse(text);
    srcName = name.replace(/\.[^.]+$/, '') || 'source';
    // auto-import: any existing Key=#hex lines become the assigned colors
    const imp = importColorsFromEntries();
    $('dropzone').hidden = true;
    $('emptyState').hidden = entries.length>0;
    $('fileMeta').hidden = false;
    $('rawView').hidden = false;
    $('fileMeta').innerHTML = `<span><b>${esc(name)}</b></span><span>${entries.length.toLocaleString()} lines</span><span>${entries.filter(e=>e.hasEq).length.toLocaleString()} keys</span><span>${(text.length/1024).toFixed(0)} KB</span>` + (imp? `<span style="color:var(--accent)">${imp} colors imported</span>`:'');
    $('srcCount').textContent = name;
    $('search').disabled = false;
    ['autoBtn','randBtn','clearBtn'].forEach(id=>$(id).disabled=false);
    renderRawView();
    recomputeCatCounts();
    buildGroupDropdown();
    // reset category selection on new file
    selGroup = null; selCat = null; $('catGroup').value=''; $('catSub').innerHTML='';
    applyFilter();
    scheduleGenerate();
    updateStats();
    if (imp) toast(`Parsed ${entries.filter(e=>e.hasEq).length.toLocaleString()} keys — ${imp} colors imported`);
  }

  function importColorsFromEntries(){
    let n=0;
    for (const e of entries){
      if (!e.hasEq) continue;
      const m = e.value.match(/^(#([0-9a-fA-F]{6}|[0-9a-fA-F]{3}))$/);
      if (m){ colors.set(e.key, normalizeHex(m[1])); n++; }
    }
    return n;
  }

  // ---------- Raw view (virtualized for large files) ----------
  function renderRawView(){
    const view = $('rawView'); view.innerHTML='';
    const MAX = 6000;
    const paint = (start,end) => {
      let html='';
      for (let i=start;i<end;i++){
        const e = entries[i]; if(!e) break;
        if (!e.hasEq){ html += `<div class="raw-line"><span class="ln">${i+1}</span><span class="lc">${esc(trunc(e.raw,120))}</span></div>`; continue; }
        const c = colors.get(e.key);
        const dot = c ? `<span class="colordot" style="background:${c}"></span>` : '';
        html += `<div class="raw-line"><span class="ln">${i+1}</span><span class="lhs">${dot}${esc(trunc(e.key,50))}</span><span class="eq">=</span><span class="rhs">${esc(trunc(e.value,90))}</span></div>`;
      }
      return html;
    };
    if (entries.length <= MAX){
      view.innerHTML = paint(0, entries.length);
    } else {
      const RAW_H = 18;
      const spacer = document.createElement('div'); spacer.style.position='relative'; spacer.style.width='100%';
      view.appendChild(spacer);
      const doPaint = ()=>{
        const H=view.clientHeight, top=view.scrollTop;
        const s=Math.max(0,Math.floor(top/RAW_H)-8), e=Math.min(entries.length,Math.ceil((top+H)/RAW_H)+8);
        spacer.style.height=(entries.length*RAW_H)+'px';
        spacer.innerHTML=paint(s,e);
      };
      view._paint=doPaint; doPaint(); view.onscroll=()=>requestAnimationFrame(doPaint);
    }
  }

  // ---------- Filtering ----------
  function applyFilter(){
    const q = $('search').value.trim().toLowerCase();
    filtered = [];
    const useCat = selCat !== null && catCounts;
    const useGroup = selGroup !== null && catCounts;
    for (let i=0;i<entries.length;i++){
      const e = entries[i];
      if (!e.hasEq) continue;
      const colored = colors.has(e.key);
      if (filterMode==='colored' && !colored) continue;
      if (filterMode==='uncolored' && colored) continue;
      if (useCat || useGroup){
        const c = categorizeKey(e.key);
        if (useCat && c !== selCat) continue;
        else if (!useCat && useGroup && !c.startsWith(selGroup+':')) continue;
      }
      if (q){ if (e.key.toLowerCase().indexOf(q)===-1 && (e.value||'').toLowerCase().indexOf(q)===-1) continue; }
      filtered.push(i);
    }
    $('centerCount').textContent = entries.length ? `${filtered.length.toLocaleString()} / ${entries.filter(e=>e.hasEq).length.toLocaleString()}` : '—';
    $('emptyState').hidden = filtered.length>0 || entries.length===0;
    $('vscroll').scrollTop = 0;
    layoutList();
  }

  // ---------- Virtual list ----------
  function layoutList(){
    const spacer = $('vspacer');
    spacer.style.height = (filtered.length*ROW_H)+'px';
    [...spacer.querySelectorAll('.row')].forEach(r=>r.remove());
    paintRows();
  }
  function paintRows(){
    const scroll = $('vscroll');
    const spacer = $('vspacer');
    const H = scroll.clientHeight || 600;
    const top = scroll.scrollTop;
    const start = Math.max(0, Math.floor(top/ROW_H)-3);
    const end = Math.min(filtered.length, start + Math.ceil(H/ROW_H)+6);
    let html='';
    for (let i=start;i<end;i++){
      const e = entries[filtered[i]];
      const c = colors.get(e.key) || '';
      const empty = !c;
      html += `<div class="row" style="top:${i*ROW_H}px" data-i="${filtered[i]}" data-key="${attr(e.key)}">
        <span class="idx">${i+1}</span>
        <label class="swatch ${empty?'empty':''}">
          <span class="fill" style="background:${c}"></span>
          <input type="color" value="${c||'#ffffff'}" aria-label="color for ${attr(e.key)}">
        </label>
        <span class="key" title="${attr(e.key)}">${esc(trunc(e.key,44))}</span>
        <span class="val" title="${attr(e.value||'')}">${esc(trunc(e.value||'',52))}</span>
        <input class="hex" value="${c||''}" placeholder="—" spellcheck="false">
        <button class="clear-x" title="Clear color" ${empty?'hidden':''} aria-label="clear"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>`;
    }
    const range = document.createRange();
    range.selectNodeContents($('vspacer'));
    range.deleteContents();
    const tmp = document.createElement('div'); tmp.innerHTML = html;
    while (tmp.firstChild) spacer.appendChild(tmp.firstChild);
  }

  // ---------- Color change ----------
  function setColor(key, hex){
    hex = normalizeHex(hex);
    if (hex) colors.set(key, hex);
    else colors.delete(key);
    markDirty();
  }
  function normalizeHex(v){
    if (!v) return null;
    v = String(v).trim();
    if (v[0] !== '#') v = '#'+v;
    if (/^#[0-9a-fA-F]{3}$/.test(v)){ v = '#'+v[1]+v[1]+v[2]+v[2]+v[3]+v[3]; }
    if (!/^#[0-9a-fA-F]{6}$/.test(v)) return null;
    return v.toUpperCase();
  }

  $('vscroll').addEventListener('input', ev=>{
    const row = ev.target.closest('.row'); if (!row) return;
    const key = row.dataset.key;
    if (ev.target.type==='color'){
      setColor(key, ev.target.value);
      const sw = row.querySelector('.swatch'); sw.classList.remove('empty');
      sw.querySelector('.fill').style.background = ev.target.value;
      row.querySelector('.hex').value = ev.target.value.toUpperCase();
      row.querySelector('.clear-x').hidden = false;
    }
  });
  $('vscroll').addEventListener('change', ev=>{
    const row = ev.target.closest('.row'); if (!row) return;
    const key = row.dataset.key;
    if (ev.target.classList.contains('hex')){
      const n = normalizeHex(ev.target.value);
      if (n){ setColor(key, n); ev.target.value = n;
        row.querySelector('.swatch').classList.remove('empty');
        row.querySelector('.swatch .fill').style.background = n;
        row.querySelector('input[type=color]').value = n;
        row.querySelector('.clear-x').hidden = false;
      } else { ev.target.value = colors.get(key)||''; }
    }
  });
  $('vscroll').addEventListener('click', ev=>{
    const x = ev.target.closest('.clear-x'); if (!x) return;
    const row = x.closest('.row'); const key = row.dataset.key;
    colors.delete(key);
    row.querySelector('.swatch').classList.add('empty');
    row.querySelector('.swatch .fill').style.background = '';
    row.querySelector('.hex').value = '';
    row.querySelector('.clear-x').hidden = true;
    markDirty();
  });
  $('vscroll').addEventListener('scroll', ()=>{ requestAnimationFrame(paintRows); }, {passive:true});

  // ---------- Search & chips ----------
  let searchTimer;
  $('search').addEventListener('input', ()=>{ clearTimeout(searchTimer); searchTimer=setTimeout(applyFilter,140); });
  document.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click', ()=>{
      document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      c.classList.add('active'); filterMode = c.dataset.filter; applyFilter();
    });
  });

  // ---------- Bulk ----------
  function eachVisible(fn){ filtered.forEach(i=>fn(entries[i].key)); }
  $('autoBtn').addEventListener('click', ()=>{
    const n = filtered.length; let i=0;
    eachVisible(k=>{ colors.set(k, hslToHex(Math.round((i/Math.max(n,1))*360), 58, 54)); i++; });
    paintRows(); markDirty();
  });
  $('randBtn').addEventListener('click', ()=>{
    eachVisible(k=>colors.set(k, hslToHex(Math.floor(Math.random()*360), 55+Math.random()*25, 45+Math.random()*18)));
    paintRows(); markDirty();
  });
  $('clearBtn').addEventListener('click', ()=>{
    eachVisible(k=>colors.delete(k));
    paintRows(); markDirty();
  });
  function hslToHex(h,s,l){
    s/=100; l/=100; const k=n=>(n+h/30)%12;
    const a=s*Math.min(l,1-l);
    const f=n=>{const c=l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return Math.round(255*c).toString(16).padStart(2,'0');};
    return ('#'+f(0)+f(8)+f(4)).toUpperCase();
  }

  // ---------- Output ----------
  function generate(){
    const out = [];
    if (outFormat==='modify'){
      // full file, real keys only; colored keys get value=hex, others keep original
      for (const e of entries){
        if (!e.hasEq){ out.push(e.raw); continue; }
        const c = colors.get(e.key);
        out.push(c != null ? `${e.key}=${c}` : e.raw);
      }
      return out.join('\r\n');
    }
    if (outFormat==='map'){
      for (const e of entries){ if (e.hasEq && colors.has(e.key)) out.push(`${e.key}=${colors.get(e.key)}`); }
      return out.join('\r\n');
    }
    // section
    out.push('[Colors]');
    for (const e of entries){ if (e.hasEq && colors.has(e.key)) out.push(`${e.key}=${colors.get(e.key)}`); }
    return out.join('\r\n');
  }
  function scheduleGenerate(){
    dirty = true; $('staleTag').hidden = false;
    if (renderPending) return; renderPending = true;
    requestAnimationFrame(()=>{ renderPending=false; $('output').value = generate(); dirty=false; $('staleTag').hidden=true; updateStats(); });
  }
  function markDirty(){ scheduleGenerate(); }
  document.querySelectorAll('#fmtSeg button').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('#fmtSeg button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); outFormat = b.dataset.fmt; updateFmtHint(); scheduleGenerate();
    });
  });
  function updateFmtHint(){
    $('fmtHint').innerHTML = outFormat==='modify' ? 'Full file, real keys only — colored keys set to <code>key=#hex</code>, rest unchanged.'
      : outFormat==='map' ? 'Only colored keys as <code>key=#hex</code>.'
      : '<code>[Colors]</code> section + colored keys.';
  }
  function updateStats(){
    let colored=0; colors.forEach(()=>colored++);
    $('stKeys').textContent = entries.filter(e=>e.hasEq).length.toLocaleString();
    $('stColored').textContent = colored;
    $('stShown').textContent = filtered.length;
  }

  // ---------- Copy / download ----------
  $('copyBtn').addEventListener('click', async ()=>{
    ensureOutput();
    const text = $('output').value;
    if (!text){ toast('Nothing to copy'); return; }
    try { await navigator.clipboard.writeText(text); }
    catch(_){ const ta=$('output'); ta.focus(); ta.select(); document.execCommand('copy'); }
    const b=$('copyBtn'); b.classList.add('done');
    b.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M20 6 9 17l-5-5"/></svg>Copied';
    setTimeout(()=>{ b.classList.remove('done'); b.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copy'; },1600);
  });
  $('dlBtn').addEventListener('click', ()=>{
    ensureOutput();
    const text=$('output').value; if (!text){ toast('Nothing to download'); return; }
    const bom = new Uint8Array([0xEF,0xBB,0xBF]);
    const blob=new Blob([bom, new TextEncoder().encode(text)],{type:'text/plain;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download = (outFormat==='modify' ? srcName : 'colors') + '.ini';
    a.click(); URL.revokeObjectURL(a.href);
  });

  // ---------- File open ----------
  $('openBtn').addEventListener('click', ()=>$('fileInput').click());
  $('fileInput').addEventListener('change', e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>loadText(String(r.result), f.name); r.readAsText(f);
    e.target.value='';
  });
  const dz=$('dropzone');
  ['dragenter','dragover'].forEach(ev=>window.addEventListener(ev,e=>{e.preventDefault(); dz.classList.add('drag');}));
  ['dragleave','drop'].forEach(ev=>window.addEventListener(ev,e=>{e.preventDefault(); dz.classList.remove('drag');}));
  window.addEventListener('drop', e=>{
    e.preventDefault(); const f=e.dataTransfer.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>loadText(String(r.result), f.name); r.readAsText(f);
  });
  $('importBtn').addEventListener('click', ()=>{
    if (!entries.length){ toast('Open an INI first'); return; }
    const n = importColorsFromEntries();
    renderRawView(); paintRows(); markDirty();
    toast(n ? `Imported ${n} colors` : 'No Key=#hex lines found');
  });

  // ---------- Known keys (merged from 4 community language packs) ----------
  let knownLoading = false;
  async function loadKnownKeys(){
    if (knownLoading || entries.length) return;
    knownLoading = true;
    const btn = $('knownBtn'); btn.disabled = true; btn.textContent = 'Loading…';
    $('emptyState').querySelector('.big').textContent = 'Loading 89k known keys…';
    $('emptyState').querySelector('p+p, p:last-child').textContent = 'Fetching the merged language-pack union.';
    $('emptyState').hidden = false;
    try {
      const res = await fetch('known-keys.ini');
      if (!res.ok) throw new Error('HTTP '+res.status);
      const text = await res.text();
      loadText(text, 'known-keys.ini');
      btn.textContent = 'Known keys loaded';
    } catch(e){
      knownLoading = false; btn.disabled = false; btn.textContent = 'Load known keys';
      $('emptyState').querySelector('.big').textContent = 'Failed to load known keys';
      toast('Could not load known-keys.ini');
    }
  }
  $('knownBtn').addEventListener('click', loadKnownKeys);

  // ---------- Category filter events ----------
  $('catGroup').addEventListener('change', e=>{
    const v = e.target.value;
    selGroup = v===''?null:+v;
    selCat = null;
    buildSubChips(selGroup);
    applyFilter();
  });
  $('catSub').addEventListener('click', e=>{
    const b = e.target.closest('.chip'); if (!b || !b.dataset.cat) return;
    if (selCat === b.dataset.cat){ selCat = null; b.classList.remove('active'); }   // toggle off
    else { selCat = b.dataset.cat; [...$('catSub').children].forEach(c=>c.classList.remove('active')); b.classList.add('active'); }
    applyFilter();
  });

  // ---------- Sample ----------
  $('sampleBtn').addEventListener('click', ()=>{
    const sample = `# sample.ini
items_commodities_Agricium=Agricium
items_commodities_Bexalite=Bexalite
items_commodities_Quantainium=Quantainium
items_commodities_Taranite=Taranite
items_commodities_Borase=Borase
items_commodities_Laranite=Laranite
items_commodities_Gold=Gold
items_commodities_Copper=Copper
items_commodities_Iron=Iron
items_commodities_Tungsten=Tungsten
item_NameQDRV_Smile_Drive_Quantum=Quantum Drive`;
    loadText(sample, 'sample.ini');
  });

  // ---------- utils ----------
  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function attr(s){ return esc(s); }
  function trunc(s,n){ s=s==null?'':String(s); return s.length>n? s.slice(0,n-1)+'…':s; }
  let toastT;
  function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

  // ---------- init ----------
  updateFmtHint();
  updateStats();
  loadCategories();
  // auto-load the known key list (merged from the 4 community language packs)
  loadKnownKeys();
  let rt;
  window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(entries.length && $('rawView')._paint) $('rawView')._paint(); paintRows(); },120); });
})();
</script>
</body>
</html>
