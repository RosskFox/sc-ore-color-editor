<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ore Color INI Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.8125rem);
    --text-sm: clamp(0.8125rem, 0.76rem + 0.28vw, 0.9rem);
    --text-base: clamp(0.875rem, 0.83rem + 0.22vw, 0.975rem);
    --text-lg: clamp(1.05rem, 0.95rem + 0.5vw, 1.2rem);
    --text-xl: clamp(1.3rem, 1.1rem + 1vw, 1.7rem);
    --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
    --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem;
    --space-8: 2rem; --space-10: 2.5rem; --space-12: 3rem;
    --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.75rem;
    --radius-full: 9999px;
    --transition: 180ms cubic-bezier(0.16,1,0.3,1);
    --font-body: 'Satoshi','Inter',system-ui,sans-serif;
    --font-mono: 'JetBrains Mono','SFMono-Regular',ui-monospace,monospace;
  }

  /* Mining / ore themed palette — dark */
  [data-theme='dark'] {
    --bg: #14110d;
    --surface: #1b1712;
    --surface-2: #221d16;
    --surface-3: #2a2319;
    --border: #393128;
    --border-soft: #2c261d;
    --text: #ece4d8;
    --text-muted: #9d9387;
    --text-faint: #6b6358;
    --accent: #d4843a;
    --accent-hover: #e69648;
    --accent-soft: rgba(212,132,58,0.14);
    --danger: #d16353;
    --success: #6daa45;
    --row-stripe: rgba(255,255,255,0.015);
  }
  /* light */
  [data-theme='light'] {
    --bg: #f5f1ea;
    --surface: #fbf8f2;
    --surface-2: #f1ebe1;
    --surface-3: #e9e1d4;
    --border: #d8cdbb;
    --border-soft: #e3d9c9;
    --text: #2a241b;
    --text-muted: #7a7166;
    --text-faint: #a99e90;
    --accent: #b5641e;
    --accent-hover: #9c5419;
    --accent-soft: rgba(181,100,30,0.12);
    --danger: #b5453a;
    --success: #4f8a28;
    --row-stripe: rgba(0,0,0,0.018);
  }

  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  html { -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  body {
    min-height:100dvh; line-height:1.55;
    font-family:var(--font-body); font-size:var(--text-base);
    color:var(--text); background:var(--bg);
    display:flex; flex-direction:column;
  }
  button { cursor:pointer; background:none; border:none; color:inherit; font:inherit; }
  input,textarea,select { font:inherit; color:inherit; }
  a,button,input,textarea,select { transition:color var(--transition),background var(--transition),border-color var(--transition),box-shadow var(--transition); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--radius-sm); }

  /* ---------- Header ---------- */
  .topbar {
    display:flex; align-items:center; gap:var(--space-4);
    padding:var(--space-3) var(--space-5);
    background:var(--surface);
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
  }
  .brand { display:flex; align-items:center; gap:var(--space-3); margin-right:auto; }
  .logo { width:34px; height:34px; flex:none; color:var(--accent); }
  .brand h1 { font-size:var(--text-lg); font-weight:700; letter-spacing:-0.01em; line-height:1; }
  .brand .sub { font-size:var(--text-xs); color:var(--text-muted); font-family:var(--font-mono); margin-top:2px; }

  .file-btn {
    display:inline-flex; align-items:center; gap:var(--space-2);
    padding:var(--space-2) var(--space-4);
    background:var(--accent); color:#1a120a;
    font-weight:700; font-size:var(--text-sm);
    border-radius:var(--radius-md);
    box-shadow:0 1px 2px rgba(0,0,0,0.25);
  }
  .file-btn:hover { background:var(--accent-hover); }
  .file-btn.ghost { background:transparent; color:var(--text); border:1px solid var(--border); box-shadow:none; }
  .file-btn.ghost:hover { background:var(--surface-2); border-color:var(--accent); }

  .icon-btn {
    width:38px; height:38px; display:grid; place-items:center;
    border:1px solid var(--border); border-radius:var(--radius-md);
    color:var(--text-muted);
  }
  .icon-btn:hover { color:var(--text); border-color:var(--accent); background:var(--surface-2); }

  .stats { display:flex; gap:var(--space-4); font-size:var(--text-xs); color:var(--text-muted); font-family:var(--font-mono); }
  .stats b { color:var(--text); font-weight:700; }

  /* ---------- Layout ---------- */
  .workspace {
    flex:1; display:grid;
    grid-template-columns: 1fr 1.15fr 1.15fr;
    min-height:0;
  }
  .pane {
    display:flex; flex-direction:column;
    min-width:0; min-height:0;
    background:var(--surface);
    border-right:1px solid var(--border);
  }
  .pane:last-child { border-right:none; }
  .pane-head {
    display:flex; align-items:center; gap:var(--space-3);
    padding:var(--space-3) var(--space-4);
    border-bottom:1px solid var(--border);
    background:var(--surface-2);
    flex-wrap:wrap;
  }
  .pane-head h2 { font-size:var(--text-sm); font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:var(--text-muted); }
  .pane-head .count { font-family:var(--font-mono); font-size:var(--text-xs); color:var(--accent); margin-left:auto; }
  .pane-body { flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column; }

  /* ---------- Left: file viewer ---------- */
  .dropzone {
    margin:var(--space-3); padding:var(--space-8) var(--space-4);
    border:2px dashed var(--border); border-radius:var(--radius-lg);
    text-align:center; color:var(--text-muted);
    display:none;
  }
  .dropzone.show { display:block; }
  .dropzone.drag { border-color:var(--accent); background:var(--accent-soft); color:var(--text); }
  .dropzone p { margin:var(--space-2) 0; }
  .dropzone .big { font-size:var(--text-base); color:var(--text); font-weight:500; }

  .file-meta {
    padding:var(--space-2) var(--space-4);
    font-family:var(--font-mono); font-size:var(--text-xs);
    color:var(--text-muted);
    border-bottom:1px solid var(--border-soft);
    display:flex; gap:var(--space-4); flex-wrap:wrap;
  }
  .file-meta b { color:var(--text); }

  .raw-view {
    flex:1; min-height:0; overflow:auto;
    font-family:var(--font-mono); font-size:12.5px; line-height:1.5;
    padding:var(--space-2) 0;
    background:var(--surface);
  }
  .raw-line {
    display:flex; gap:var(--space-3); padding:0 var(--space-4);
    white-space:pre; border-left:2px solid transparent;
  }
  .raw-line:hover { background:var(--row-stripe); }
  .raw-line .ln { color:var(--text-faint); user-select:none; text-align:right; min-width:3.5em; flex:none; }
  .raw-line .lc { color:var(--text-muted); }
  .raw-line .lhs { color:var(--accent); }
  .raw-line .eq { color:var(--text-faint); }
  .raw-line .rhs { color:var(--text); }

  /* ---------- Center: color picker list ---------- */
  .toolbar {
    display:flex; align-items:center; gap:var(--space-2);
    padding:var(--space-2) var(--space-3);
    border-bottom:1px solid var(--border-soft);
    flex-wrap:wrap;
  }
  .search {
    flex:1; min-width:120px;
    display:flex; align-items:center; gap:var(--space-2);
    padding:var(--space-2) var(--space-3);
    background:var(--surface-3); border:1px solid var(--border);
    border-radius:var(--radius-md);
  }
  .search svg { flex:none; color:var(--text-faint); }
  .search input { flex:1; background:none; border:none; outline:none; font-size:var(--text-sm); }
  .search input::placeholder { color:var(--text-faint); }

  .mini-btn {
    padding:var(--space-2) var(--space-3);
    font-size:var(--text-xs); font-weight:500;
    border:1px solid var(--border); border-radius:var(--radius-md);
    color:var(--text-muted); background:var(--surface-3);
    white-space:nowrap;
  }
  .mini-btn:hover { color:var(--text); border-color:var(--accent); }
  .mini-btn.danger:hover { color:var(--danger); border-color:var(--danger); }

  .filter-chips { display:flex; gap:var(--space-2); padding:var(--space-2) var(--space-3) 0; flex-wrap:wrap; }
  .chip {
    padding:var(--space-1) var(--space-3); font-size:var(--text-xs);
    border:1px solid var(--border); border-radius:var(--radius-full);
    color:var(--text-muted); background:var(--surface-3);
  }
  .chip.active { color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }

  .list-wrap { flex:1; min-height:0; overflow:hidden; position:relative; }
  .vscroll { height:100%; overflow-y:auto; overflow-anchor:none; }
  .vspacer { position:relative; width:100%; }

  .row {
    position:absolute; left:0; right:0;
    display:flex; align-items:center; gap:var(--space-3);
    padding:var(--space-2) var(--space-4);
    border-bottom:1px solid var(--border-soft);
  }
  .row:nth-child(even) { background:var(--row-stripe); }
  .row .idx { font-family:var(--font-mono); font-size:11px; color:var(--text-faint); min-width:3em; text-align:right; flex:none; }
  .swatch {
    position:relative; width:34px; height:34px; flex:none;
    border-radius:var(--radius-sm); border:1px solid var(--border);
    cursor:pointer; overflow:hidden;
    background:
      linear-gradient(45deg, var(--surface-3) 25%, transparent 25%) 0 0/10px 10px,
      linear-gradient(-45deg, var(--surface-3) 25%, transparent 25%) 0 5px/10px 10px;
  }
  .swatch input[type=color] {
    position:absolute; inset:-2px; width:calc(100% + 4px); height:calc(100% + 4px);
    border:none; padding:0; cursor:pointer; opacity:0;
  }
  .swatch .fill { position:absolute; inset:0; }
  .swatch.empty .fill { display:none; }
  .row .key {
    font-family:var(--font-mono); font-size:12px; font-weight:500;
    color:var(--text); flex:1; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .row .val {
    font-family:var(--font-mono); font-size:11px; color:var(--text-faint);
    flex:1.2; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .hex {
    width:84px; flex:none;
    font-family:var(--font-mono); font-size:11px;
    padding:var(--space-1) var(--space-2);
    background:var(--surface-3); border:1px solid var(--border);
    border-radius:var(--radius-sm); text-align:center;
    text-transform:uppercase;
  }
  .hex:focus { border-color:var(--accent); }
  .clear-x {
    width:22px; height:22px; flex:none; display:grid; place-items:center;
    color:var(--text-faint); border-radius:var(--radius-sm);
  }
  .clear-x:hover { color:var(--danger); background:var(--surface-3); }

  .empty-state { padding:var(--space-12); text-align:center; color:var(--text-muted); }
  .empty-state svg { color:var(--text-faint); margin:0 auto var(--space-4); }

  /* ---------- Right: output ---------- */
  .out-actions { display:flex; gap:var(--space-2); margin-left:auto; }
  .seg {
    display:flex; border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden;
    background:var(--surface-3);
  }
  .seg button {
    padding:var(--space-2) var(--space-3); font-size:var(--text-xs);
    color:var(--text-muted); border-right:1px solid var(--border);
  }
  .seg button:last-child { border-right:none; }
  .seg button.active { background:var(--accent-soft); color:var(--accent); }
  .copy-btn {
    padding:var(--space-2) var(--space-4); font-size:var(--text-sm); font-weight:700;
    background:var(--accent); color:#1a120a; border-radius:var(--radius-md);
    display:inline-flex; align-items:center; gap:var(--space-2);
  }
  .copy-btn:hover { background:var(--accent-hover); }
  .copy-btn.done { background:var(--success); }
  .dl-btn {
    padding:var(--space-2) var(--space-3); font-size:var(--text-xs);
    border:1px solid var(--border); border-radius:var(--radius-md); color:var(--text-muted);
  }
  .dl-btn:hover { color:var(--text); border-color:var(--accent); }

  .out-format {
    padding:var(--space-2) var(--space-4);
    border-bottom:1px solid var(--border-soft);
    display:flex; gap:var(--space-4); align-items:center; font-size:var(--text-xs); color:var(--text-muted);
  }
  .out-format code { font-family:var(--font-mono); color:var(--accent); background:var(--accent-soft); padding:1px 6px; border-radius:var(--radius-sm); }

  .out-stale { color:var(--danger); font-family:var(--font-mono); margin-left:auto; }
  textarea.output {
    flex:1; min-height:0; resize:none;
    font-family:var(--font-mono); font-size:12.5px; line-height:1.5;
    padding:var(--space-3); background:var(--surface); border:none; outline:none;
    tab-size:4; white-space:pre; overflow:auto;
  }

  /* toast */
  .toast {
    position:fixed; bottom:var(--space-6); left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--surface-3); border:1px solid var(--border);
    color:var(--text); padding:var(--space-3) var(--space-5);
    border-radius:var(--radius-md); font-size:var(--text-sm); font-weight:500;
    box-shadow:0 8px 24px rgba(0,0,0,0.3);
    opacity:0; pointer-events:none; transition:all var(--transition); z-index:50;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width: 980px) {
    .workspace { grid-template-columns:1fr; grid-auto-rows:minmax(300px,1fr); }
    .pane { border-right:none; border-bottom:1px solid var(--border); }
    .stats { display:none; }
  }
  @media (prefers-reduced-motion: reduce) { *{transition-duration:0.01ms!important;} }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <path d="M16 3 5 9v14l11 6 11-6V9L16 3Z"/>
      <path d="M16 3v14M5 9l11 8 11-8" opacity="0.6"/>
    </svg>
    <div>
      <h1>Ore Color INI Editor</h1>
      <div class="sub">load an .ini · pick a color per key · export</div>
    </div>
  </div>

  <div class="stats" id="stats">
    <span><b id="stEntries">0</b> entries</span>
    <span><b id="stColored">0</b> colored</span>
    <span><b id="stLines">0</b> lines</span>
  </div>

  <input type="file" id="fileInput" accept=".ini,.txt,.cfg,.conf,text/plain" hidden />
  <button class="file-btn ghost" id="sampleBtn">Load sample</button>
  <button class="file-btn" id="openBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
    Open INI
  </button>
  <button class="icon-btn" id="themeBtn" aria-label="Toggle theme"></button>
</header>

<main class="workspace">

  <!-- LEFT: file viewer -->
  <section class="pane" id="leftPane">
    <div class="pane-head">
      <h2>Source file</h2>
      <span class="count" id="srcCount">no file</span>
    </div>
    <div class="pane-body">
      <div class="dropzone show" id="dropzone">
        <p class="big">Drop an .ini here</p>
        <p>or use “Open INI”. Each <code style="font-family:var(--font-mono);color:var(--accent)">key=value</code> line becomes an ore type.</p>
      </div>
      <div class="file-meta" id="fileMeta" hidden></div>
      <div class="raw-view" id="rawView" hidden></div>
    </div>
  </section>

  <!-- CENTER: color picker -->
  <section class="pane" id="centerPane">
    <div class="pane-head">
      <h2>Ore types</h2>
      <span class="count" id="centerCount">—</span>
    </div>
    <div class="pane-body">
      <div class="toolbar">
        <label class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" id="search" placeholder="Filter keys or values…" />
        </label>
        <button class="mini-btn" id="autoBtn" title="Assign distinct colors to all filtered">Auto-color</button>
        <button class="mini-btn" id="randBtn" title="Random palette for filtered">Randomize</button>
        <button class="mini-btn danger" id="clearBtn" title="Clear colors on filtered">Clear</button>
      </div>
      <div class="filter-chips">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="colored">Colored</button>
        <button class="chip" data-filter="uncolored">Uncolored</button>
      </div>
      <div class="list-wrap">
        <div class="vscroll" id="vscroll">
          <div class="vspacer" id="vspacer"></div>
        </div>
      </div>
      <div class="empty-state" id="emptyState" hidden>
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 7h-9M14 17H5M17 7a3 3 0 1 0-6 0M7 17a3 3 0 1 0-6 0"/></svg>
        <p>No ore types match.</p>
      </div>
    </div>
  </section>

  <!-- RIGHT: output -->
  <section class="pane" id="rightPane">
    <div class="pane-head">
      <h2>Modified INI</h2>
      <div class="out-actions">
        <button class="dl-btn" id="dlBtn" title="Download .ini">Download</button>
        <button class="copy-btn" id="copyBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          Copy
        </button>
      </div>
    </div>
    <div class="out-format">
      <div class="seg" id="fmtSeg">
        <button class="active" data-fmt="append">Append lines</button>
        <button data-fmt="map">Color map only</button>
      </div>
      <span id="fmtHint"></span>
      <span class="out-stale" id="staleTag" hidden>● stale</span>
    </div>
    <textarea class="output" id="output" spellcheck="false" placeholder="Load a file and assign colors — the modified INI appears here."></textarea>
  </section>

</main>

<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';

  // ---------- State ----------
  const ROW_H = 48;
  let lines = [];            // raw original lines (no trailing newline)
  let entries = [];         // {i, lhs, rhs, raw, hasEq}
  let filtered = [];        // entries passing current search + filter
  let colors = new Map();   // lhs -> #RRGGBB
  let fileName = 'global.ini';
  let filterMode = 'all';
  let outFormat = 'append';
  let dirty = false, renderPending = false;
  let firstRender = 0, lastRender = 0;

  const $ = id => document.getElementById(id);

  // ---------- Theme ----------
  (function(){
    let t = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark':'light';
    document.documentElement.setAttribute('data-theme', t);
    const b = $('themeBtn');
    const paint = () => b.innerHTML = t==='dark'
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2M12 20.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1.5 12h2M20.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>';
    paint();
    b.addEventListener('click', ()=>{ t = t==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',t); paint(); });
  })();

  // ---------- Parsing ----------
  function parse(text){
    // normalize line endings, strip BOM
    text = text.replace(/^\uFEFF/, '');
    lines = text.split(/\r\n|\r|\n/);
    if (lines.length && lines[lines.length-1] === '') lines.pop();
    entries = [];
    for (let i=0;i<lines.length;i++){
      const raw = lines[i];
      const eq = raw.indexOf('=');
      if (eq === -1){ entries.push({i, lhs:null, rhs:null, raw, hasEq:false}); }
      else { entries.push({i, lhs:raw.slice(0,eq), rhs:raw.slice(eq+1), raw, hasEq:true}); }
    }
  }

  // ---------- File loading ----------
  function loadText(text, name){
    parse(text);
    fileName = name || 'global.ini';
    colors = new Map();
    $('dropzone').classList.remove('show');
    $('fileMeta').hidden = false;
    $('rawView').hidden = false;
    $('fileMeta').innerHTML = `<span><b>${esc(fileName)}</b></span><span>${lines.length.toLocaleString()} lines</span><span>${entries.filter(e=>e.hasEq).length.toLocaleString()} entries</span><span>${(text.length/1024).toFixed(0)} KB</span>`;
    renderRawView();
    applyFilter();
    scheduleGenerate();
    updateStats();
  }

  function renderRawView(){
    const view = $('rawView');
    // virtualize the raw view too for very large files
    view.innerHTML = '';
    const MAX = 20000; // direct render cap; beyond that virtualize
    if (lines.length <= MAX){
      const frag = document.createDocumentFragment();
      for (let i=0;i<lines.length;i++){
        const e = entries[i];
        const ln = document.createElement('div');
        ln.className = 'raw-line';
        if (!e.hasEq){
          ln.innerHTML = `<span class="ln">${i+1}</span><span class="lc">${esc(e.raw)}</span>`;
        } else {
          ln.innerHTML = `<span class="ln">${i+1}</span><span class="lhs">${esc(e.lhs)}</span><span class="eq">=</span><span class="rhs">${esc(trunc(e.rhs,120))}</span>`;
        }
        frag.appendChild(ln);
      }
      view.appendChild(frag);
    } else {
      renderRawVirtual();
    }
  }
  function renderRawVirtual(){
    const view = $('rawView');
    view.innerHTML = '';
    const spacer = document.createElement('div');
    spacer.style.position='relative'; spacer.style.width='100%';
    view.appendChild(spacer);
    const RAW_H = 19;
    const paint = () => {
      const H = view.clientHeight;
      const top = view.scrollTop;
      const start = Math.max(0, Math.floor(top/RAW_H)-5);
      const end = Math.min(lines.length, Math.ceil((top+H)/RAW_H)+5);
      spacer.style.height = (lines.length*RAW_H)+'px';
      let html='';
      for (let i=start;i<end;i++){
        const e = entries[i];
        html += !e.hasEq
          ? `<div class="raw-line" style="position:absolute;top:${i*RAW_H}px"><span class="ln">${i+1}</span><span class="lc">${esc(trunc(e.raw,160))}</span></div>`
          : `<div class="raw-line" style="position:absolute;top:${i*RAW_H}px"><span class="ln">${i+1}</span><span class="lhs">${esc(trunc(e.lhs,80))}</span><span class="eq">=</span><span class="rhs">${esc(trunc(e.rhs,120))}</span></div>`;
      }
      spacer.innerHTML = html;
    };
    view._paint = paint;
    paint();
    view.onscroll = () => requestAnimationFrame(paint);
  }

  // ---------- Filtering ----------
  function applyFilter(){
    const q = $('search').value.trim().toLowerCase();
    filtered = entries.filter(e=>{
      if (!e.hasEq) return false;
      if (filterMode==='colored' && !colors.has(e.lhs)) return false;
      if (filterMode==='uncolored' && colors.has(e.lhs)) return false;
      if (q){
        if (e.lhs.toLowerCase().indexOf(q)===-1 && (e.rhs||'').toLowerCase().indexOf(q)===-1) return false;
      }
      return true;
    });
    $('centerCount').textContent = filtered.length ? `${filtered.length.toLocaleString()} shown` : '—';
    $('emptyState').hidden = filtered.length>0;
    $('vscroll').scrollTop = 0;
    layoutList();
  }

  // ---------- Virtual list ----------
  function layoutList(){
    const scroll = $('vscroll');
    const spacer = $('vspacer');
    spacer.style.height = (filtered.length*ROW_H)+'px';
    // clear existing rows
    [...spacer.querySelectorAll('.row')].forEach(r=>r.remove());
    paintRows();
  }
  function paintRows(){
    const scroll = $('vscroll');
    const spacer = $('vspacer');
    const H = scroll.clientHeight;
    const top = scroll.scrollTop;
    const start = Math.max(0, Math.floor(top/ROW_H)-2);
    const end = Math.min(filtered.length, Math.ceil((top+H)/ROW_H)+2);
    firstRender = start; lastRender = end;
    let html='';
    for (let i=start;i<end;i++){
      const e = filtered[i];
      const c = colors.get(e.lhs) || '';
      html += rowHTML(e, i, c);
    }
    // build nodes
    const range = document.createRange();
    range.selectNodeContents(spacer);
    range.deleteContents();
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    while (tmp.firstChild) spacer.appendChild(tmp.firstChild);
  }

  function rowHTML(e, idx, c){
    const empty = !c;
    return `<div class="row" style="top:${idx*ROW_H}px" data-i="${idx}" data-lhs="${attr(e.lhs)}">
      <span class="idx">${idx+1}</span>
      <label class="swatch ${empty?'empty':''}" style="--cv:${c||'transparent'}">
        <span class="fill" style="background:${c}"></span>
        <input type="color" value="${c||'#d4843a'}" aria-label="color for ${attr(e.lhs)}">
      </label>
      <span class="key" title="${attr(e.lhs)}">${esc(trunc(e.lhs,40))}</span>
      <span class="val" title="${attr(e.rhs||'')}">${esc(trunc(e.rhs||'',48))}</span>
      <input class="hex" value="${c||''}" placeholder="—" spellcheck="false">
      <button class="clear-x" title="Clear color" ${empty?'hidden':''} aria-label="clear">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>`;
  }

  // ---------- Color change handling ----------
  function setColor(lhs, hex){
    hex = normalizeHex(hex);
    if (hex){ colors.set(lhs, hex); }
    else { colors.delete(lhs); }
    markDirty();
  }
  function normalizeHex(v){
    if (!v) return null;
    v = v.trim();
    if (v[0] !== '#') v = '#'+v;
    if (/^#[0-9a-fA-F]{3}$/.test(v)){ v = '#'+v[1]+v[1]+v[2]+v[2]+v[3]+v[3]; }
    if (!/^#[0-9a-fA-F]{6}$/.test(v)) return null;
    return v.toUpperCase();
  }

  // event delegation on list
  $('vscroll').addEventListener('input', ev=>{
    const row = ev.target.closest('.row'); if (!row) return;
    const lhs = row.dataset.lhs;
    if (ev.target.type==='color'){
      setColor(lhs, ev.target.value);
      row.querySelector('.swatch').classList.remove('empty');
      row.querySelector('.swatch .fill').style.background = ev.target.value;
      const hex = row.querySelector('.hex'); hex.value = ev.target.value.toUpperCase();
      row.querySelector('.clear-x').hidden = false;
    } else if (ev.target.classList.contains('hex')){
      // debounced via change; nothing here
    }
  });
  $('vscroll').addEventListener('change', ev=>{
    const row = ev.target.closest('.row'); if (!row) return;
    const lhs = row.dataset.lhs;
    if (ev.target.classList.contains('hex')){
      const n = normalizeHex(ev.target.value);
      if (n){ setColor(lhs, n); ev.target.value = n;
        row.querySelector('.swatch').classList.remove('empty');
        row.querySelector('.swatch .fill').style.background = n;
        const ci = row.querySelector('input[type=color]'); ci.value = n;
        row.querySelector('.clear-x').hidden = false;
      } else { ev.target.value = colors.get(lhs)||''; }
    }
  });
  $('vscroll').addEventListener('click', ev=>{
    const x = ev.target.closest('.clear-x'); if (!x) return;
    const row = x.closest('.row');
    setColor(row.dataset.lhs, null);
    row.querySelector('.swatch').classList.add('empty');
    row.querySelector('.swatch .fill').style.background = '';
    row.querySelector('.hex').value = '';
    row.querySelector('.clear-x').hidden = true;
  });

  $('vscroll').addEventListener('scroll', ()=>{
    requestAnimationFrame(()=>{ paintRows(); });
  }, {passive:true});

  // ---------- Search & filter chips ----------
  let searchTimer;
  $('search').addEventListener('input', ()=>{ clearTimeout(searchTimer); searchTimer=setTimeout(applyFilter,140); });
  document.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click', ()=>{
      document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      c.classList.add('active');
      filterMode = c.dataset.filter;
      applyFilter();
    });
  });

  // ---------- Bulk actions ----------
  function eachFiltered(fn){
    // operate on unique lhs within filtered
    const seen = new Set();
    filtered.forEach(e=>{ if (!seen.has(e.lhs)){ seen.add(e.lhs); fn(e.lhs); } });
  }
  $('autoBtn').addEventListener('click', ()=>{
    const n = filtered.length;
    let i = 0;
    eachFiltered(lhs=>{
      const hue = Math.round((i/Math.max(n,1))*360);
      colors.set(lhs, hslToHex(hue, 62, 52));
      i++;
    });
    paintRows(); markDirty();
  });
  $('randBtn').addEventListener('click', ()=>{
    eachFiltered(lhs=>{ colors.set(lhs, hslToHex(Math.floor(Math.random()*360), 55+Math.random()*25, 45+Math.random()*15)); });
    paintRows(); markDirty();
  });
  $('clearBtn').addEventListener('click', ()=>{
    eachFiltered(lhs=>{ colors.delete(lhs); });
    paintRows(); markDirty();
  });

  function hslToHex(h,s,l){
    s/=100; l/=100;
    const k=n=>(n+h/30)%12;
    const a=s*Math.min(l,1-l);
    const f=n=>{const c=l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return Math.round(255*c).toString(16).padStart(2,'0');};
    return ('#'+f(0)+f(8)+f(4)).toUpperCase();
  }

  // ---------- Output generation ----------
  function generate(){
    const parts = [];
    if (outFormat==='map'){
      for (const e of entries){
        if (e.hasEq && colors.has(e.lhs)){
          parts.push(e.lhs + '=' + colors.get(e.lhs));
        }
      }
    } else { // append
      for (const e of entries){
        parts.push(e.raw);
        if (e.hasEq && colors.has(e.lhs)){
          parts.push(e.lhs + '_Color=' + colors.get(e.lhs));
        }
      }
    }
    return parts.join('\n');
  }
  function scheduleGenerate(){
    dirty = true;
    $('staleTag').hidden = false;
    if (renderPending) return;
    renderPending = true;
    requestAnimationFrame(()=>{
      renderPending = false;
      $('output').value = generate();
      dirty = false;
      $('staleTag').hidden = true;
      updateStats();
    });
  }
  function markDirty(){ scheduleGenerate(); }

  // format seg
  document.querySelectorAll('#fmtSeg button').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('#fmtSeg button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      outFormat = b.dataset.fmt;
      updateFmtHint();
      scheduleGenerate();
    });
  });
  function updateFmtHint(){
    $('fmtHint').innerHTML = outFormat==='append'
      ? 'Adds <code>Key_Color=#RRGGBB</code> after each colored line.'
      : 'Only outputs <code>Key=#RRGGBB</code> for colored entries.';
  }

  // ---------- Stats ----------
  function updateStats(){
    $('stEntries').textContent = entries.filter(e=>e.hasEq).length.toLocaleString();
    $('stColored').textContent = colors.size.toLocaleString();
    $('stLines').textContent = lines.length.toLocaleString();
    $('srcCount').textContent = lines.length ? fileName : 'no file';
  }

  // ---------- Copy / download ----------
  $('copyBtn').addEventListener('click', async ()=>{
    const text = $('output').value;
    if (!text){ toast('Nothing to copy yet'); return; }
    try{
      await navigator.clipboard.writeText(text);
    }catch(_){
      const ta=$('output'); ta.focus(); ta.select(); document.execCommand('copy');
    }
    const b=$('copyBtn'); b.classList.add('done');
    b.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M20 6 9 17l-5-5"/></svg>Copied';
    setTimeout(()=>{ b.classList.remove('done'); b.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copy'; },1600);
  });
  $('dlBtn').addEventListener('click', ()=>{
    const text=$('output').value;
    if (!text){ toast('Nothing to download yet'); return; }
    const blob=new Blob([text],{type:'text/plain;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download = outFormat==='map' ? 'ore_colors.ini' : fileName.replace(/(\.ini)$/i,'_colored$1') || 'output.ini';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  // ---------- File open ----------
  $('openBtn').addEventListener('click', ()=>$('fileInput').click());
  $('fileInput').addEventListener('change', e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>loadText(String(r.result), f.name);
    r.readAsText(f);
    e.target.value='';
  });
  // drag & drop on whole window
  const dz=$('dropzone');
  ['dragenter','dragover'].forEach(ev=>window.addEventListener(ev,e=>{e.preventDefault(); if(dz.classList.contains('show'))dz.classList.add('drag');}));
  ['dragleave','drop'].forEach(ev=>window.addEventListener(ev,e=>{e.preventDefault(); dz.classList.remove('drag');}));
  window.addEventListener('drop', e=>{
    e.preventDefault();
    const f=e.dataTransfer.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>loadText(String(r.result), f.name);
    r.readAsText(f);
  });

  // ---------- Sample ----------
  $('sampleBtn').addEventListener('click', ()=>{
    const sample = `# Star Citizen global.ini (sample)
ASD_Quartz=Pristine Quartz
ASD_Agricium=Agricium Deposit
ASD_Bexalite=Bexalite Vein
ASD_Borase=Borase Cluster
ASD_Copper=Copper Ore
ASD_Diamond=Diamond Reserve
ASD_Gold=Gold Nugget
ASD_Hephaestanite=Hephaestanite
ASD_Laranite=Laranite Seam
ASD_Quantainium=Quantainium
ASD_Taranite=Taranite Ore
ASD_Tungsten=Tungsten Chunk
ASD_Unknown,P=Unidentified Material`;
    loadText(sample, 'sample.ini');
  });

  // ---------- utils ----------
  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function attr(s){ return esc(s); }
  function trunc(s,n){ s=s==null?'':String(s); return s.length>n? s.slice(0,n-1)+'…':s; }
  let toastT;
  function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

  // ---------- init ----------
  updateFmtHint();
  applyFilter();
  updateStats();
  // re-paint on resize
  let rt;
  window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(lines.length) { if ($('rawView')._paint) $('rawView')._paint(); paintRows(); } },120); });
})();
</script>
</body>
</html>
